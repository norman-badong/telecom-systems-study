name: C++ CI Pipeline

# Trigger this pipeline whenever you push code to the main branch
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest # Runs on a clean cloud-based Linux virtual machine

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Compile Server and Client
      run: |
        g++ -std=c++17 -pthread server.cpp -o server
        g++ -std=c++17 client.cpp -o client
        echo "Compilation successful!"